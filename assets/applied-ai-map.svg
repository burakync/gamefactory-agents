<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" role="img" aria-labelledby="title desc"><title id="title">Applied AI → engineering</title><desc id="desc">Course-inspired ideas mapped to actual components</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7e99af"/></marker></defs><rect width="560" height="680" rx="18" fill="#111b29"/><g font-family="Arial, sans-serif"><text x="28" y="42" fill="#e8eff7" font-size="23" font-weight="700">Applied AI → engineering</text><text x="28" y="67" fill="#a2b3c6" font-size="13">Course-inspired ideas mapped to actual components</text><rect x="28" y="95" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="122" fill="#f0f5fa" font-size="17" font-weight="600">Context Engineering</text><text x="44" y="144" fill="#aabccd" font-size="13">→ Shared Project State</text><rect x="28" y="183" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#b09bdd"/><text x="44" y="210" fill="#f0f5fa" font-size="17" font-weight="600">Multi-Agent Systems</text><text x="44" y="232" fill="#aabccd" font-size="13">→ Bounded Specialist Roles</text><rect x="28" y="271" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="298" fill="#f0f5fa" font-size="17" font-weight="600">Harness Engineering</text><text x="44" y="320" fill="#aabccd" font-size="13">→ Contracts, Tools &amp; Isolation</text><rect x="28" y="359" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#b09bdd"/><text x="44" y="386" fill="#f0f5fa" font-size="17" font-weight="600">Observability</text><text x="44" y="408" fill="#aabccd" font-size="13">→ Execution Traces &amp; History</text><rect x="28" y="447" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="474" fill="#f0f5fa" font-size="17" font-weight="600">Evaluation</text><text x="44" y="496" fill="#aabccd" font-size="13">→ QA + Review Obligations</text><rect x="28" y="535" width="504" height="68" rx="10" fill="#1b2a3d" stroke="#b09bdd"/><text x="44" y="562" fill="#f0f5fa" font-size="17" font-weight="600">Human-in-the-Loop</text><text x="44" y="584" fill="#aabccd" font-size="13">→ Commit Gate + Owner Review</text><text x="28" y="657" fill="#a2b3c6" font-size="13">Mappings describe mechanisms, not autonomous performance.</text></g></svg>
