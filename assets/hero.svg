<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-labelledby="title desc"><title id="title">Context → work → evidence</title><desc id="desc">A controlled workflow for AI-assisted game development</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7e99af"/></marker></defs><rect width="560" height="370" rx="18" fill="#111b29"/><g font-family="Arial, sans-serif"><text x="28" y="42" fill="#e8eff7" font-size="23" font-weight="700">Context → work → evidence</text><text x="28" y="67" fill="#a2b3c6" font-size="13">A controlled workflow for AI-assisted game development</text><rect x="28" y="95" width="504" height="62" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="122" fill="#f0f5fa" font-size="17" font-weight="600">Shared intent</text><text x="44" y="144" fill="#aabccd" font-size="13">Requirements, decisions and human authority</text><path d="M280 157L280 182" fill="none" stroke="#7e99af" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="188" width="504" height="62" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="215" fill="#f0f5fa" font-size="17" font-weight="600">Bounded execution</text><text x="44" y="237" fill="#aabccd" font-size="13">External workers and explicitly configured tools</text><path d="M280 250L280 275" fill="none" stroke="#7e99af" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="281" width="504" height="62" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="308" fill="#f0f5fa" font-size="17" font-weight="600">Inspectable outcomes</text><text x="44" y="330" fill="#aabccd" font-size="13">Tests, review and retained failure evidence</text></g></svg>
