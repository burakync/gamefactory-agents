<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 740" role="img" aria-labelledby="title desc"><title id="title">Production and evaluation loop</title><desc id="desc">Requirements lead to planning, execution, testing, evaluation and human review. Failure routes to bounded revision and replanning; stale authority stops work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#83a4b7"/></marker></defs><rect width="680" height="740" rx="18" fill="#111b29"/><g font-family="Arial,sans-serif"><text x="28" y="42" fill="#e8eff7" font-size="24" font-weight="700">Production &amp; evaluation</text><text x="28" y="67" fill="#a2b3c6" font-size="14">Real execution, bounded revision, explicit human approval</text><rect x="28" y="100" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="126" fill="#f0f5fa" font-size="18" font-weight="600">Requirements</text><text x="44" y="149" fill="#aabccd" font-size="14">Owner intent and protected behavior</text><path d="M218 164V187" fill="none" stroke="#83a4b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="190" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="216" fill="#f0f5fa" font-size="18" font-weight="600">Planning</text><text x="44" y="239" fill="#aabccd" font-size="14">Context selection and readiness gates</text><path d="M218 254V277" fill="none" stroke="#83a4b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="280" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="306" fill="#f0f5fa" font-size="18" font-weight="600">Task execution</text><text x="44" y="329" fill="#aabccd" font-size="14">External worker or disclosed fallback</text><path d="M218 344V367" fill="none" stroke="#83a4b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="370" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="396" fill="#f0f5fa" font-size="18" font-weight="600">Testing</text><text x="44" y="419" fill="#aabccd" font-size="14">Real results and native errors</text><path d="M218 434V457" fill="none" stroke="#83a4b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="460" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="486" fill="#f0f5fa" font-size="18" font-weight="600">Evaluation</text><text x="44" y="509" fill="#aabccd" font-size="14">Technical evidence and uncertainty</text><path d="M218 524V547" fill="none" stroke="#83a4b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="550" width="382" height="64" rx="10" fill="#1b2a3d" stroke="#76d6b8"/><text x="44" y="576" fill="#f0f5fa" font-size="18" font-weight="600">Human review</text><text x="44" y="599" fill="#aabccd" font-size="14">Accept or request a bounded revision</text><rect x="454" y="370" width="198" height="102" rx="10" fill="#282836" stroke="#d9b77b"/><text x="470" y="398" fill="#edd7a8" font-size="17">Diagnose / revise</text><text x="470" y="422" fill="#bbc7d7" font-size="13">Only within authority</text><text x="470" y="444" fill="#bbc7d7" font-size="13">and rework bounds</text><path d="M410 402H451M410 582H550V476M550 370V222H414" fill="none" stroke="#d9b77b" stroke-width="2" marker-end="url(#arrow)"/><text x="462" y="348" fill="#d9b77b" font-size="13">Failure / revision</text><text x="462" y="204" fill="#d9b77b" font-size="13">Replan before retry</text><text x="28" y="673" fill="#e8eff7" font-size="15">Stale authority → STOP. Technical PASS ≠ visual approval.</text><text x="28" y="702" fill="#a2b3c6" font-size="14">This is a workflow map, not a claim of autonomous execution.</text></g></svg>
